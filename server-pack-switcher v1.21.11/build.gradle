plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    flatDir {
        dirs 'e:/Minecraft Project/minecraft-mod-release-hub/archives/Dasik Library'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_dependency", project.minecraft_dependency

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version,
               "minecraft_dependency": project.minecraft_dependency
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveBaseName = project.archives_base_name
    from("LICENSE") {
        rename "LICENSE_${project.archives_base_name}", "LICENSE"
    }
}

remapJar {
    archiveBaseName = project.archives_base_name
}

afterEvaluate {
    tasks.register('archiveReleaseJar', Copy) {
        dependsOn build
        def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
        from targetJarTask.archiveFile
        into file("../Archive Jar of all versions/MC 1.21.11")
        doLast {
            def jarFile = targetJarTask.archiveFile.get().asFile
            println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to local Archive directory: ${destinationDir.absolutePath}"

            // Mod Local Legacy Archive (../Archive)
            File legacyArchiveDir = file("../Archive")
            if (legacyArchiveDir.exists()) {
                copy {
                    from jarFile
                    into legacyArchiveDir
                }
                println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to legacy Archive directory: ${legacyArchiveDir.absolutePath}"
            }

            // 1. Modrinth Profile Auto-Deploy
            def profileModsDir = file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.21.11/mods")
            if (profileModsDir.exists()) {
                profileModsDir.listFiles().each { f ->
                    if (f.name.startsWith("${project.archives_base_name}-") && f.name.endsWith(".jar") && !f.name.equals(jarFile.name)) {
                        println "[AUTO-DEPLOY] Purging stale version: ${f.name}"
                        f.delete()
                    }
                }
                copy {
                    from jarFile
                    into profileModsDir
                }
                println "[AUTO-DEPLOY] Successfully deployed ${jarFile.name} to Modrinth profile: ${profileModsDir.absolutePath}"
            }

            // 2. Central Release Hub Archives Sync
            File hubDir = file("E:/Minecraft Project/minecraft-mod-release-hub/archives/Server Pack Switcher")
            if (!hubDir.exists()) {
                hubDir.mkdirs()
            }
            copy {
                from jarFile
                into hubDir
            }
            println "[HUB-ARCHIVE] Successfully copied ${jarFile.name} to release hub archives: ${hubDir.absolutePath}"

            // 3. External Vault Archive Sync
            File vaultDir = file("D:/Minecraft Mod Archive Jars/Server Pack Switcher")
            if (!vaultDir.exists() && file("D:/").exists()) {
                vaultDir.mkdirs()
            }
            if (vaultDir.exists()) {
                copy {
                    from jarFile
                    into vaultDir
                }
                println "[VAULT-ARCHIVE] Successfully copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
            }
        }
    }
    build.finalizedBy archiveReleaseJar
}
